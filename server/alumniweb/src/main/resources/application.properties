spring.application.name=alumniweb
spring.profiles.active=${SPRING_PROFILES_ACTIVE:env}
server.port=8080

# Local secrets live in repo-root .env (properties format). Optional so builds/CI
# pass without it; OS env vars still take precedence when set.
spring.config.import=optional:file:./.env[.properties],optional:file:./../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alumniweb}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.error.include-stacktrace=never
server.error.include-message=never

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=alumniweb
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}


spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.debug=true

logging.level.org.springframework.mail=DEBUG
logging.level.com.alumniweb.alumniweb.service.impl=DEBUG